schema_version: 1
# Agent Foundry project settings. Managed conversationally through your coding
# agent; the authoritative definitions live in the foundry/SETTINGS_SPEC.md of
# the source repository. Keys not listed there are project-owned custom keys:
# preserve them. See also the /settings command contract.
profile: balanced # minimal | balanced | autonomous-engineer | visual-engineer | research-engineer | custom
reviews:
  strictness: standard # standard | strict
  independent_review_high_risk: true # bool
delegation:
  policy: recommend # off | recommend | automatic
  max_parallel_workers: 2 # integer 1-4
session_learning:
  enabled: true # bool
  auto_write: false # bool
documentation:
  auto_update: true # bool
