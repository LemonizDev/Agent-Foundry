name: Agent Foundry CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Run test suite
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          result=0
          npm test > test-output.txt 2>&1 || result=$?
          cat test-output.txt
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
      - name: Publish test failure details to pull request
        if: steps.tests.outputs.exit_code != '0' && runner.os == 'Linux' && matrix.node == 20
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('test-output.txt', 'utf8').slice(-12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '### Agent Foundry CI test failure\n\n```text\n' + output + '\n```'
            });
      - name: Fail if tests failed
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - run: npm run validate:repo
      - run: node bin/agent-foundry.js version
      - run: node bin/agent-foundry.js inspect --project .
      - run: npm pack --dry-run
