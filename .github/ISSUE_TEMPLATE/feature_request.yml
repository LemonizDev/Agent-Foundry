name: Feature request
description: Propose a user problem and a practical improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem, not a proposed pile of configuration. Check existing issues and the documentation first.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Who encounters it, and in what situation?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current workaround
      description: How do you handle this today? What is missing?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the user-visible result. Avoid prescribing implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What other approaches have you considered?
  - type: dropdown
    id: area
    attributes:
      label: Relevant area
      multiple: true
      options:
        - Resource library
        - CLI / installer
        - Coding-agent host integration
        - Model delegation
        - Documentation
        - Security
        - Developer experience
        - Other
