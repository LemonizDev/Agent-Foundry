name: Feature request
description: Suggest an improvement to Agent Foundry.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Describe the user problem, not only the proposed mechanism.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What workflow or outcome is currently difficult?
      placeholder: A clear, concise description of the user need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How should Agent Foundry address it? Consider context-file and conversational solutions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What other approaches have you considered?
  - type: dropdown
    id: area
    attributes:
      label: Relevant area
      multiple: true
      options:
        - Resource library
        - Conversational management
        - Coding-agent host integration
        - Model delegation
        - Documentation
        - Security
        - Developer experience
        - Other
