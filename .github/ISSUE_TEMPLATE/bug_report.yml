name: Bug report
description: Report a reproducible problem in Agent Foundry.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Never include API keys, credentials, private repository contents or personal data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is wrong.
      placeholder: A clear, concise description.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest reliable reproduction.
      placeholder: |
        1. Run ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Foundry version or commit
      placeholder: "0.4.0 or full commit SHA"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Maintenance Node.js version (repository checks only)
      placeholder: "node --version"
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Ubuntu / Debian
        - Other Linux
        - Other
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Coding-agent host
      multiple: true
      options:
        - Codex
        - Claude Code
        - OpenCode
        - Kilo Code
        - Cline
        - Not host-specific
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets, usernames, private paths and project data before sharing.
